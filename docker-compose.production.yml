services:
  mailpit:
    profiles: ["development-only"]
  native_builder:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_local_production
    volumes: !override
      - ./backend/data:/app/data
      - native_build_cache:/app/data/native_cache
  migrate:
    image: anilux-backend:local-release
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_local_production
    volumes: !override
      - ./backend/data:/app/data
  backend:
    image: anilux-backend:local-release
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_local_production
    volumes: !override
      - ./backend/data:/app/data
      - seo_shell:/app/frontend_dist:ro
    ports: !override
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=4); c.request('GET','/api/social/chats/'); r=c.getresponse(); assert r.status == 401, r.status"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
  celery_worker:
    image: anilux-backend:local-release
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_local_production
    volumes: !override
      - ./backend/data:/app/data
  celery_beat:
    image: anilux-backend:local-release
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_local_production
    volumes: !override
      - ./backend/data:/app/data
  post_media_worker:
    image: anilux-backend:local-release
    container_name: anilux_post_media_worker
    restart: unless-stopped
    cpus: 2
    mem_limit: 2g
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_local_production
    command: ["python", "docker_entrypoint.py", "celery", "-A", "config", "worker", "-Q", "post_media", "-l", "info", "--concurrency=1", "--prefetch-multiplier=1", "--hostname=post-media@%h"]
    volumes:
      - ./backend/data:/app/data
    networks:
      - anilux_network
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    build: ./frontend
    image: anilux-frontend:local-release
    container_name: anilux_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - seo_shell:/seo-shell
      - ./backend/data/private_post_media:/app/post-private:ro
      - ./backend/data/media:/app/post-legacy:ro
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    networks:
      - anilux_network
