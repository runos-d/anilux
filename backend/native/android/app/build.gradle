plugins { id 'com.android.application' }
android {
    namespace 'org.anilux.app'
    compileSdk 35
    defaultConfig { applicationId 'org.anilux.app'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0' }
    signingConfigs { release {
        storeFile file(System.getenv('ANILUX_KEYSTORE_PATH'))
        storePassword System.getenv('ANILUX_KEYSTORE_PASSWORD')
        keyAlias 'anilux'
        keyPassword System.getenv('ANILUX_KEYSTORE_PASSWORD')
    } }
    buildTypes { release { signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.13.0' }
