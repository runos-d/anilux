events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # Docker may assign a different backend address after a restart.
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream backend {
        zone backend 64k;
        server backend:8000 resolve;
    }

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 260m;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /health { try_files /health.html =404; }
        location = /robots.txt { try_files /__django_document__ @document; }
        location ~ ^/sitemap(?:-[a-z]+-[0-9]+)?\.xml$ { try_files /__django_document__ @document; }
        location = /manifest.webmanifest {
            default_type application/manifest+json;
            add_header Cache-Control no-cache;
            try_files $uri =404;
        }
        # Existing installations may still request the old manifest URL.
        location = /manifest.json { return 302 /manifest.webmanifest; }
        location = /sw.js {
            add_header Cache-Control no-cache;
            try_files $uri =404;
        }
        # Preserve Django's /api prefix; bypass static assets and public caches.
        location ^~ /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_cache off;
            proxy_set_header X-Post-Accel 1;
        }
        location ^~ /_post_private/ { internal; alias /app/post-private/; }
        location ^~ /_post_legacy/ { internal; alias /app/post-legacy/; }
        location ^~ /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }
        location ~ ^/(?:data/)?media/(?:attachments|message_media|scheduled_messages|chat_backups)/ { return 404; }
        location ~ ^/(?:data/)?media/(?<public_media>(?:posters|franchise_posters|avatars|covers|playlist_covers|def_avatars|img)/.+)$ {
            alias /app/post-legacy/$public_media;
            expires 1d;
        }
        location /media/ {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
        }
        location /data/media/ {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
        }
        location ^~ /static/ {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
        }
        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
        # Keep locally hosted HLS media origin-clean for WebGL/Anime4K.
        # Direct CDN sources must return the same headers themselves.
        location ~* \.(?:m3u8|ts)$ {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Headers "Range, Content-Type" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
            try_files $uri @document;
        }
        location = /index.html { return 301 /; }
        location = /sakura.svg {
            expires 7d;
            try_files $uri =404;
        }
        location = /site-navigation.json {
            expires 1h;
            add_header Cache-Control "public";
            try_files $uri =404;
        }
        # Static files remain nginx's responsibility; documents require real
        # Django statuses/content. There is no User-Agent switch or HTML cache.
        location ~* \.(?:js|css|png|jpg|jpeg|webp|avif|svg|ico|woff2?|ttf|mp4|webm|txt)$ {
            try_files $uri @document;
        }
        location / { try_files /__django_document__ @document; }
        location @document {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache off;
        }
    }
}
