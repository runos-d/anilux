name: animecore-scalability-lab
x-backend: &backend
  image: animecore-scalability-backend:lab
  build: { context: ../../backend }
  environment: &environment
    DJANGO_SETTINGS_MODULE: config.settings_scalability_lab
    DJANGO_SECRET_KEY: disposable-scalability-lab-not-a-production-secret
    DEBUG: 'false'
    DB_HOST: lab-mysql
    DB_NAME: scalability_lab
    DB_USER: root
    DB_PASSWORD: disposable-lab
    REDIS_HOST: lab-realtime
    CACHE_REDIS_URL: redis://lab-cache:6379/0
    CELERY_BROKER_URL: redis://lab-broker:6379/0
    CELERY_RESULT_BACKEND: redis://lab-broker:6379/1
    NATIVE_AUTO_BUILD_ON_START: 'false'
    OPERATIONAL_METRICS_ENABLED: 'true'
    OPERATIONAL_METRICS_TOKEN: disposable-lab-metrics
    OPERATIONAL_TRACE_SAMPLE_RATE: '0.01'
  volumes: [lab-files:/lab-data, 'lab-seo:/app/frontend_dist:ro']
  networks: [lab]
  cpus: '1'
  mem_limit: 1g
  logging: { driver: local, options: { max-size: 10m, max-file: '2' } }
services:
  lab-mysql:
    image: registry-1.docker.io/library/mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    environment: { MYSQL_DATABASE: scalability_lab, MYSQL_ROOT_PASSWORD: disposable-lab }
    command: [--innodb-buffer-pool-size=256M, --max-connections=128, --skip-name-resolve]
    volumes: [lab-mysql:/var/lib/mysql]
    networks: [lab]
    cpus: '2'
    mem_limit: 1536m
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h127.0.0.1 -uroot --silent']
      interval: 5s
      timeout: 3s
      retries: 40
  lab-realtime:
    image: registry-1.docker.io/library/redis:7@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
    command: [redis-server, --maxmemory, 192mb, --maxmemory-policy, noeviction]
    networks: [lab]
    cpus: '0.5'
    mem_limit: 256m
    healthcheck: { test: [CMD, redis-cli, ping], interval: 5s, timeout: 2s, retries: 10 }
  lab-cache:
    image: registry-1.docker.io/library/redis:7@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
    command: [redis-server, --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
    networks: [lab]
    cpus: '0.5'
    mem_limit: 192m
    healthcheck: { test: [CMD, redis-cli, ping], interval: 5s, timeout: 2s, retries: 10 }
  lab-broker:
    image: registry-1.docker.io/library/redis:7@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
    command: [redis-server, --maxmemory, 128mb, --maxmemory-policy, noeviction, --appendonly, 'yes']
    volumes: [lab-broker:/data]
    networks: [lab]
    cpus: '0.5'
    mem_limit: 192m
    healthcheck: { test: [CMD, redis-cli, ping], interval: 5s, timeout: 2s, retries: 10 }
  migrate:
    <<: *backend
    command: [python, manage.py, migrate, --noinput]
    depends_on: { lab-mysql: { condition: service_healthy }, lab-realtime: { condition: service_healthy }, lab-cache: { condition: service_healthy }, lab-broker: { condition: service_healthy } }
  api:
    <<: *backend
    deploy: { replicas: 2 }
    networks: { lab: { aliases: [backend] } }
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/',timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 30s
      retries: 10
  events:
    <<: *backend
    command: [python, docker_entrypoint.py, celery, -A, config, worker, -Q, celery, -l, warning, --concurrency=1, --prefetch-multiplier=1]
    depends_on: { migrate: { condition: service_completed_successfully } }
  frontend:
    image: animecore-scalability-frontend:lab
    build: { context: ../../frontend }
    ports: ['127.0.0.1:4480:80']
    networks: { lab: {}, generator: {} }
    volumes: [lab-seo:/seo-shell]
    cpus: '0.5'
    mem_limit: 256m
    depends_on: { api: { condition: service_healthy } }
  generator:
    image: animecore-scalability-backend:lab
    profiles: [load]
    entrypoint: [python, /load/http_load.py]
    volumes: ['../../tests/scalability:/load:ro']
    networks: [generator]
    cpus: '1'
    mem_limit: 256m
    depends_on: { frontend: { condition: service_started } }
networks:
  lab: { internal: true }
  generator: {}
volumes:
  lab-mysql: {}
  lab-files: {}
  lab-seo: {}
  lab-broker: {}
