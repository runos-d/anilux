worker_processes 1;
worker_rlimit_nofile 65536;
events { worker_connections 32768; }
http {
  log_format safe_request '$remote_addr $request_method $uri $status $request_time';
  access_log /var/log/nginx/access.log safe_request;
  resolver 127.0.0.11 valid=5s ipv6=off;
  map $http_upgrade $upgrade_connection { default upgrade; '' ''; }
  upstream application {
    zone application 64k;
    least_conn;
    server backend:8000 resolve;
    keepalive 32;
  }
  server {
    listen 8000;
    client_max_body_size 260m;
    location = /gateway-health { access_log off; return 200; }
    location / {
      proxy_pass http://application;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Real-IP $http_x_real_ip;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $upgrade_connection;
      proxy_connect_timeout 2s;
      proxy_read_timeout 90s;
      proxy_send_timeout 90s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      # Prepared-file redirects are consumed by the public edge, not this hop.
      proxy_ignore_headers X-Accel-Redirect;
      proxy_pass_header X-Accel-Redirect;
    }
  }
}
