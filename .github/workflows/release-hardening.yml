name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test:unit:run
      - run: npm run build-only
      - run: npm run check:bundle
      - run: npm run audit:production

  backend:
    name: Backend checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_DATABASE: project_test
          MYSQL_USER: project
          MYSQL_PASSWORD: project-test-password
          MYSQL_ROOT_PASSWORD: root-test-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot-test-password"
          --health-interval=10s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: test-only-ci-key
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: project_test
      DB_USER: root
      DB_PASSWORD: root-test-password
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      EMAIL_PROVIDER: mailpit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install pip-audit==2.9.0
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - run: pip-audit -r requirements.lock

  images:
    name: Container builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t project-backend:test backend
      - run: docker build -t project-frontend:test frontend
